# nginx CORS Configuration - R17 Item #6
# Production-ready CORS headers for phext.io + mirrorborn.us
# Critical for SQ Admin API + Arena integration

# Server block for phext.io
server {
    listen 80;
    listen [::]:80;
    server_name phext.io www.phext.io;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name phext.io www.phext.io;
    
    # SSL Configuration (use Let's Encrypt certificates)
    ssl_certificate /etc/letsencrypt/live/phext.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phext.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # CORS headers for API endpoints
    # Allow requests from mirrorborn.us and localhost (dev)
    set $cors_origin "";
    if ($http_origin ~* ^https?://(localhost|127\.0\.0\.1|mirrorborn\.us|phext\.io)(:[0-9]+)?$) {
        set $cors_origin $http_origin;
    }
    
    # Root directory
    root /var/www/phext.io;
    index index.html;
    
    # Main site (static files)
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # API proxy to SQ Admin API (running on :3000)
    location /api/ {
        # CORS preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, x-csrf-token" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        
        # Proxy to Node.js backend
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # CORS headers
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, x-csrf-token" always;
        add_header Access-Control-Allow-Credentials "true" always;
    }
    
    # SQ direct access (optional - for Arena)
    location /sq/ {
        # CORS preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        
        # Proxy to SQ on :1337
        rewrite ^/sq/(.*) /api/v2/$1 break;
        proxy_pass http://localhost:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # CORS headers
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
    }
    
    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;
    
    # Logging
    access_log /var/log/nginx/phext.io-access.log;
    error_log /var/log/nginx/phext.io-error.log;
}

# Server block for mirrorborn.us (similar config)
server {
    listen 80;
    listen [::]:80;
    server_name mirrorborn.us www.mirrorborn.us;
    
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mirrorborn.us www.mirrorborn.us;
    
    ssl_certificate /etc/letsencrypt/live/mirrorborn.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mirrorborn.us/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # CORS origin whitelist
    set $cors_origin "";
    if ($http_origin ~* ^https?://(localhost|127\.0\.0\.1|mirrorborn\.us|phext\.io)(:[0-9]+)?$) {
        set $cors_origin $http_origin;
    }
    
    root /var/www/mirrorborn.us;
    index index.html landing.html;
    
    location / {
        try_files $uri $uri/ /landing.html;
    }
    
    # Same API/SQ proxy config as phext.io
    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, x-csrf-token" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, x-csrf-token" always;
        add_header Access-Control-Allow-Credentials "true" always;
    }
    
    location /sq/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        
        rewrite ^/sq/(.*) /api/v2/$1 break;
        proxy_pass http://localhost:1337;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
    }
    
    # SQ on custom port (1337) for direct access
    location :1337/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        
        proxy_pass http://localhost:1337;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
    }
    
    access_log /var/log/nginx/mirrorborn.us-access.log;
    error_log /var/log/nginx/mirrorborn.us-error.log;
}

# Rate limiting zones (DDoS protection)
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=sq:10m rate=100r/s;

