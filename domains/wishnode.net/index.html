<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WishNode — Your AI Agent, Always On</title>
    <meta name="description" content="Managed agent hosting. Your agent runs 24/7. No servers. No setup.">
    
    <link rel="stylesheet" href="https://mirrorborn.us/css/sq-cloud.css">
    
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #2E3440;
            color: #D8DEE9;
        }
        
        .hero {
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }
        
        .hero-icon {
            font-size: 6rem;
            margin-bottom: 1rem;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
        
        h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #A3BE8C 0%, #88C0D0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .tagline {
            font-size: 1.5rem;
            color: #A3BE8C;
            margin-bottom: 2rem;
        }
        
        .description {
            max-width: 600px;
            font-size: 1.125rem;
            line-height: 1.7;
            color: rgba(216, 222, 233, 0.9);
            margin-bottom: 2rem;
        }
        
        .status {
            background: rgba(163, 190, 140, 0.1);
            border: 1px solid #A3BE8C;
            border-radius: 8px;
            padding: 1rem 2rem;
            display: inline-block;
            margin-bottom: 2rem;
        }
        
        .status-label {
            font-weight: 600;
            color: #A3BE8C;
            text-transform: uppercase;
            font-size: 0.875rem;
            letter-spacing: 0.1em;
        }
        
        .launch-date {
            font-size: 1.25rem;
            color: #D8DEE9;
            margin-top: 0.5rem;
        }
        
        .cta-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .btn {
            padding: 1rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        
        .btn-primary {
            background: #A3BE8C;
            color: #2E3440;
        }
        
        .btn-primary:hover {
            background: #88C0D0;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: transparent;
            border: 2px solid #A3BE8C;
            color: #A3BE8C;
        }
        
        .btn-secondary:hover {
            background: rgba(163, 190, 140, 0.1);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <!-- Ecosystem Nav -->
    <div id="ecosystem-nav"></div>
    
    <main class="hero">
        <div class="hero-icon">🌐</div>
        <h1>WishNode</h1>
        <p class="tagline">Your AI agent, running 24/7.</p>
        
        <p class="description">
            No servers. No setup. Just your agent, always on. Pre-configured 
            OpenClaw + SQ Cloud + monitoring. You provide the prompt, we run the node.
        </p>
        
        <div class="status">
            <div class="status-label">Launching Q2 2026</div>
            <div class="launch-date">Target: May 1, 2026</div>
        </div>
        
        <div class="cta-group">
            <a href="https://mirrorborn.us" class="btn btn-primary">Explore SQ Cloud →</a>
            <a href="https://discord.gg/clawd" class="btn btn-secondary">Get Notified</a>
        </div>
    </main>
    
    <!-- Ecosystem Footer -->
    <div id="ecosystem-footer"></div>
    
    <script>
    // Load ecosystem components
    fetch('https://mirrorborn.us/components/ecosystem-nav.html')
        .then(r => r.text())
        .then(html => document.getElementById('ecosystem-nav').innerHTML = html);
        
    fetch('https://mirrorborn.us/components/ecosystem-footer.html')
        .then(r => r.text())
        .then(html => document.getElementById('ecosystem-footer').innerHTML = html);
    </script>
    <script src="https://mirrorborn.us/js/load-footer.js"></script>
</body>
</html>
