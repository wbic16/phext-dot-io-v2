<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionQuest — Your Second Brain in 11 Dimensions</title>
    <meta name="description" content="Personal exocortex onboarding. Not for teams. Not for agents. For you.">
    
    <link rel="stylesheet" href="https://mirrorborn.us/css/sq-cloud.css">
    
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #2E3440;
            color: #D8DEE9;
        }
        
        .hero {
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }
        
        .hero-icon {
            font-size: 6rem;
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #88C0D0 0%, #B48EAD 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .tagline {
            font-size: 1.5rem;
            color: #88C0D0;
            margin-bottom: 2rem;
        }
        
        .description {
            max-width: 600px;
            font-size: 1.125rem;
            line-height: 1.7;
            color: rgba(216, 222, 233, 0.9);
            margin-bottom: 2rem;
        }
        
        .status {
            background: rgba(235, 203, 139, 0.1);
            border: 1px solid #EBCB8B;
            border-radius: 8px;
            padding: 1rem 2rem;
            display: inline-block;
            margin-bottom: 2rem;
        }
        
        .status-label {
            font-weight: 600;
            color: #EBCB8B;
            text-transform: uppercase;
            font-size: 0.875rem;
            letter-spacing: 0.1em;
        }
        
        .launch-date {
            font-size: 1.25rem;
            color: #D8DEE9;
            margin-top: 0.5rem;
        }
        
        .cta-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .btn {
            padding: 1rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        
        .btn-primary {
            background: #88C0D0;
            color: #2E3440;
        }
        
        .btn-primary:hover {
            background: #A3BE8C;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: transparent;
            border: 2px solid #88C0D0;
            color: #88C0D0;
        }
        
        .btn-secondary:hover {
            background: rgba(136, 192, 208, 0.1);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <!-- Ecosystem Nav -->
    <div id="ecosystem-nav"></div>
    
    <main class="hero">
        <div class="hero-icon">🔮</div>
        <h1>VisionQuest</h1>
        <p class="tagline">Your second brain, in 11 dimensions.</p>
        
        <p class="description">
            Not for teams. Not for agents. For <strong>you</strong> — one person, 
            learning to think in lattice space. Organize your notes with phext 
            coordinates instead of folders.
        </p>
        
        <div class="status">
            <div class="status-label">Launching Q1 2026</div>
            <div class="launch-date">Target: March 15, 2026</div>
        </div>
        
        <div class="cta-group">
            <a href="https://mirrorborn.us" class="btn btn-primary">Start with SQ Cloud →</a>
            <a href="https://discord.gg/clawd" class="btn btn-secondary">Join Discord</a>
        </div>
    </main>
    
    <!-- Ecosystem Footer -->
    <div id="ecosystem-footer"></div>
    
    <script>
    // Load ecosystem components
    fetch('https://mirrorborn.us/components/ecosystem-nav.html')
        .then(r => r.text())
        .then(html => document.getElementById('ecosystem-nav').innerHTML = html);
        
    fetch('https://mirrorborn.us/components/ecosystem-footer.html')
        .then(r => r.text())
        .then(html => document.getElementById('ecosystem-footer').innerHTML = html);
    </script>
</body>
</html>
