<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Repeatable lattice background pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(136, 192, 208, 0.05)" stroke-width="0.5"/>
    </pattern>
    <pattern id="diagonals" width="80" height="80" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="80" y2="80" stroke="rgba(180, 142, 173, 0.03)" stroke-width="0.5"/>
      <line x1="80" y1="0" x2="0" y2="80" stroke="rgba(163, 190, 140, 0.03)" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <rect width="400" height="400" fill="#2E3440"/>
  <rect width="400" height="400" fill="url(#grid)"/>
  <rect width="400" height="400" fill="url(#diagonals)"/>
  
  <!-- Faint coordinate nodes -->
  <g fill="rgba(136, 192, 208, 0.08)">
    <circle cx="80" cy="80" r="3"/>
    <circle cx="160" cy="160" r="3"/>
    <circle cx="240" cy="240" r="3"/>
    <circle cx="320" cy="320" r="3"/>
    <circle cx="200" cy="200" r="4" opacity="0.5"/>
  </g>
</svg>
